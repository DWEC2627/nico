<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicios JavaScript DWEC</title>
</head>
<body>
    <h1>Ejercicios de JavaScript</h1>
    <p>Selecciona un ejercicio y mira el resultado en la consola (F12).</p>

    <h2>Unidad 2</h2>
    <p><a href="?ejercicio=2_1">Ejercicio 2.1</a></p>
    <p><a href="?ejercicio=2_2">Ejercicio 2.2</a></p>
    <p><a href="?ejercicio=2_3">Ejercicio 2.3</a></p>
    <p><a href="?ejercicio=2_4">Ejercicio 2.4</a></p>

    <h2>Unidad 4</h2>
    <p><a href="?ejercicio=4_1">Ejercicio 4.1</a></p>
    <p><a href="?ejercicio=4_2">Ejercicio 4.2</a></p>
    <p><a href="?ejercicio=4_3">Ejercicio 4.3</a></p>
    <p><a href="?ejercicio=4_4">Ejercicio 4.4</a></p>
    <p><a href="?ejercicio=4_5">Ejercicio 4.5</a></p>
    <p><a href="?ejercicio=4_6">Ejercicio 4.6</a></p>

    <script>
        // Cargo solamente el ejercicio elegido para que no se mezclen las variables.
        let ejercicio = new URLSearchParams(window.location.search).get("ejercicio");
        let lista = ["2_1", "2_2", "2_3", "2_4", "4_1", "4_2", "4_3", "4_4", "4_5", "4_6"];
        if (lista.includes(ejercicio)) {
            let archivo = document.createElement("script");
            archivo.src = "./DWEC_nico_ejercicios/ejercicio_" + ejercicio + ".js";
            document.body.appendChild(archivo);
        }
    </script>
</body>
</html>
